[project]
name = "streamflow-getter"
version = "0.0.1"
description = "Download streamflow time series from NWM, NRDS and GEOGLOWS output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
streamflow-getter = "streamflow_getter.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamflow_getter"]
