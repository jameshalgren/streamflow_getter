name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: uv sync --locked --extra operational --extra spatial --extra parquet
      - name: Run tests
        run: uv run --locked --extra operational --extra spatial --extra parquet pytest -q -ra
